<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>El Más Insano</title>
    <style>
        body { 
            background: #0d0d1a; 
            color: #00ffcc; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 40px;
        }

        /* Texto grande con animación RGB de colores arriba */
        @keyframes rainbowText {
            0% { color: #ff0055; text-shadow: 0 0 20px #ff0055; }
            20% { color: #ff9900; text-shadow: 0 0 20px #ff9900; }
            40% { color: #33ff00; text-shadow: 0 0 20px #33ff00; }
            60% { color: #00ffff; text-shadow: 0 0 20px #00ffff; }
            80% { color: #9900ff; text-shadow: 0 0 20px #9900ff; }
            100% { color: #ff0055; text-shadow: 0 0 20px #ff0055; }
        }

        marquee {
            font-size: 65px;
            font-weight: 900;
            width: 100%;
            margin-top: 15px;
            letter-spacing: 2px;
            animation: rainbowText 2s infinite linear;
        }

        /* Animación de rayos y parpadeo eléctrico para la imagen */
        @keyframes rayosElectricos {
            0% { transform: scale(1); filter: brightness(1) drop-shadow(0 0 15px #00ffcc); }
            25% { transform: scale(1.02); filter: brightness(1.6) drop-shadow(0 0 30px #ff0055) hue-rotate(90deg); }
            50% { transform: scale(0.98); filter: brightness(0.9) drop-shadow(0 0 15px #00ffcc); }
            75% { transform: scale(1.03); filter: brightness(1.8) drop-shadow(0 0 40px #00ffff) hue-rotate(-90deg); }
            100% { transform: scale(1); filter: brightness(1) drop-shadow(0 0 15px #00ffcc); }
        }

        img {
            max-width: 280px;
            max-height: 35vh;
            border-radius: 20px;
            margin: 15px 0;
            animation: rayosElectricos 0.8s infinite ease-in-out;
        }

        /* Panel del Minijuego de Dados */
        .game-container {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            border-radius: 20px;
            padding: 20px;
            width: 85%;
            max-width: 420px;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .game-title {
            font-size: 22px;
            color: #fff;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        /* Visor del Dado */
        .dice-box {
            font-size: 60px;
            background: #111;
            width: 90px;
            height: 90px;
            line-height: 90px;
            margin: 10px auto;
            border-radius: 15px;
            border: 3px solid #ff0055;
            box-shadow: 0 0 15px #ff0055;
            color: #fff;
            transition: transform 0.2s;
        }

        .rolling {
            animation: spinDice 0.5s infinite linear;
        }

        @keyframes spinDice {
            0% { transform: rotate(0deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1.1); }
        }

        /* Controles */
        .controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 15px;
            gap: 10px;
        }

        select, button {
            padding: 12px 18px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            outline: none;
            cursor: pointer;
        }

        select {
            background: #1a1a3a;
            color: #00ffcc;
            border: 1px solid #00ffcc;
        }

        button {
            background: linear-gradient(45deg, #ff0055, #ff9900);
            color: #fff;
            box-shadow: 0 0 10px #ff0055;
            transition: 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Mensajes de resultado y victorias */
        .result-msg {
            margin-top: 15px;
            font-size: 18px;
            min-height: 25px;
            font-weight: bold;
        }

        .wins-count {
            font-size: 16px;
            color: #ff9900;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Texto con luces RGB -->
    <marquee scrollamount="14">EL MAS INSANO EN CLASH ROYALE 👑</marquee>

    <!-- Imagen parpadeante -->
    <img src="pagina.jpeg" alt="Insano">

    <!-- Juego del Dado -->
    <div class="game-container">
        <div class="game-title">🎲 Adivina el Dado 🎲</div>

        <div class="dice-box" id="dice">?</div>

        <div class="controls">
            <div>
                <label style="display:block; font-size: 12px; margin-bottom: 5px; color:#aaa;">Tu Predicción:</label>
                <select id="userPrediction">
                    <option value="1">Número 1</option>
                    <option value="2">Número 2</option>
                    <option value="3">Número 3</option>
                    <option value="4">Número 4</option>
                    <option value="5">Número 5</option>
                    <option value="6">Número 6</option>
                </select>
            </div>

            <button onclick="rollDice()">¡Girar Dado!</button>
        </div>

        <div class="result-msg" id="result">Elige tu número y gira.</div>
        <div class="wins-count">🏆 Victorias: <span id="wins">0</span></div>
    </div>

    <script>
        let wins = 0;

        function rollDice() {
            const diceEl = document.getElementById('dice');
            const resultEl = document.getElementById('result');
            const prediction = parseInt(document.getElementById('userPrediction').value);

            // Efecto visual de giro
            diceEl.classList.add('rolling');
            resultEl.innerText = "Girando...";
            resultEl.style.color = "#00ffcc";

            setTimeout(() => {
                // Número aleatorio del 1 al 6
                const diceRoll = Math.floor(Math.random() * 6) + 1;
                
                diceEl.classList.remove('rolling');
                diceEl.innerText = diceRoll;

                if (diceRoll === prediction) {
                    wins++;
                    document.getElementById('wins').innerText = wins;
                    resultEl.innerText = "¡ACERTASTE! 🔥 ¡Qué insano!";
                    resultEl.style.color = "#33ff00";
                } else {
                    resultEl.innerText = `Salió ${diceRoll}. ¡Intenta de nuevo! ❌`;
                    resultEl.style.color = "#ff0055";
                }
            }, 600);
        }
    </script>
</body>
</html>
